<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Inner Center — 3D Viewer</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    height: 100%;
    background: #1a1a1a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  .overlay {
    position: fixed;
    pointer-events: none;
    z-index: 10;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
  }

  #roomLabel {
    top: 16px;
    left: 16px;
    font-size: 18px;
    font-weight: 500;
    letter-spacing: 0.5px;
    background: rgba(0,0,0,0.35);
    padding: 8px 14px;
    border-radius: 4px;
    backdrop-filter: blur(6px);
  }
  #levelIndicator {
    top: 16px;
    right: 16px;
    font-size: 14px;
    background: rgba(0,0,0,0.35);
    padding: 8px 14px;
    border-radius: 4px;
    backdrop-filter: blur(6px);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  #prompt {
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 16px;
    background: rgba(255,255,255,0.9);
    color: #222;
    padding: 10px 20px;
    border-radius: 24px;
    display: none;
    text-shadow: none;
    font-weight: 500;
  }
  #prompt.visible { display: block; }

  #minimap {
    position: fixed;
    bottom: 16px;
    right: 16px;
    width: 220px;
    height: 220px;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 6px;
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(6px);
    z-index: 10;
  }

  /* ---------- Start screen ---------- */
  #startScreen {
    position: fixed;
    inset: 0;
    /* Slate blue base, matching the reference image */
    background: radial-gradient(ellipse at center, #4d6573 0%, #34464f 70%, #283640 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    cursor: pointer;
    text-align: center;
    padding: 40px;
    overflow: hidden;
  }
  /* Abstract organic curves layer — recreates the reference image */
  #startScreen::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 800'><g fill='none' stroke='%23a8d4e6' stroke-width='9' stroke-linecap='round'><path d='M 470 130 q 30 -50 70 -20 q 30 30 -10 60' /><path d='M 600 110 q -20 50 30 80' /><path d='M 720 130 q 60 -20 80 40 q 10 50 -50 50 q -40 0 -30 -50' /><path d='M 840 150 q 50 -30 90 0 q 30 30 -10 70' /><path d='M 400 220 q -60 30 -90 -10 q -30 -40 30 -70 q 60 -20 80 30' /><path d='M 540 250 q -20 -30 -70 -30' /><path d='M 670 230 q 30 30 80 10' /><path d='M 360 340 q 30 -40 -20 -80 q -50 -30 -90 30 q -30 60 30 100' /><path d='M 470 360 q -30 -40 10 -80' /><path d='M 580 350 q 50 20 100 -10 q 50 -40 0 -80' /><path d='M 770 380 q 20 -30 70 -20 q 50 20 20 80' /><path d='M 400 460 q -50 30 -90 -10' /><path d='M 510 480 q 60 -10 100 30' /><path d='M 650 490 q -10 50 -70 60' /><path d='M 760 500 q 40 -50 90 0 q 30 50 -30 70' /><path d='M 920 460 q -30 30 10 90' /><path d='M 480 600 q -60 -10 -70 -70' /><path d='M 600 590 q 30 -40 80 -30' /><path d='M 740 620 q -40 40 30 90' /></g></svg>");
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    opacity: 0.85;
    pointer-events: none;
    /* Soft drift animation */
    animation: drift 22s ease-in-out infinite alternate;
  }
  @keyframes drift {
    0%   { transform: translate(-1%, -0.5%) scale(1.02); }
    100% { transform: translate(1%, 0.5%) scale(1.05); }
  }
  /* Vignette on top */
  #startScreen::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(20, 30, 36, 0.55) 100%);
    pointer-events: none;
  }
  #startScreen > * {
    position: relative;
    z-index: 1;
  }
  #startScreen h1 {
    font-size: 44px;
    font-weight: 200;
    margin: 0 0 8px;
    letter-spacing: 6px;
    text-transform: uppercase;
    text-shadow: 0 2px 12px rgba(0,0,0,0.4);
  }
  #startScreen .subtitle {
    font-size: 13px;
    opacity: 0.7;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 40px;
  }
  #startScreen .controls {
    font-size: 13px;
    opacity: 0.75;
    line-height: 2.0;
    margin-bottom: 36px;
    letter-spacing: 1px;
  }
  #startScreen .cta {
    padding: 14px 36px;
    border: 1px solid rgba(255,255,255,0.5);
    border-radius: 2px;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(4px);
    transition: background 0.25s, border-color 0.25s, transform 0.25s, opacity 0.25s;
    opacity: 0.55;
  }
  #startScreen.ready { cursor: pointer; }
  #startScreen.ready .cta { opacity: 1; }
  #startScreen.ready:hover .cta {
    background: rgba(255,255,255,0.14);
    border-color: rgba(255,255,255,0.85);
    transform: translateY(-1px);
  }
  #startScreen:not(.ready) { cursor: progress; }
  #startScreen:not(.ready) .cta { pointer-events: none; }
  #startScreen.hidden { display: none; }

  /* Loading bar shown while assets load */
  #loadBar {
    position: absolute;
    bottom: 56px;
    left: 50%;
    transform: translateX(-50%);
    width: 220px;
    height: 2px;
    background: rgba(255,255,255,0.15);
    border-radius: 2px;
    overflow: hidden;
    z-index: 2;
  }
  #loadBar > div {
    height: 100%;
    background: rgba(220, 235, 245, 0.95);
    width: 0;
    transition: width 0.2s ease-out;
  }
  #loadLabel {
    position: absolute;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0.55;
    z-index: 2;
  }

  #helpHint {
    position: fixed;
    bottom: 16px;
    left: 16px;
    font-size: 12px;
    opacity: 0.55;
    background: rgba(0,0,0,0.35);
    padding: 6px 12px;
    border-radius: 4px;
    z-index: 10;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="app"></div>

<div id="roomLabel" class="overlay">—</div>
<div id="levelIndicator" class="overlay">Underground</div>
<div id="prompt" class="overlay">Press <b>E</b> to use the stairs</div>
<div id="helpHint">WASD to move · Mouse to look · E on stairs · ESC to release mouse</div>
<canvas id="minimap" width="440" height="440"></canvas>

<div id="startScreen">
  <h1>The Inner Center</h1>
  <div class="subtitle">Body &amp; Soul Connection · Graz</div>
  <div class="controls">
    WASD / Arrows — Move<br/>
    Mouse — Look around<br/>
    E — Use stairs between levels<br/>
    ESC — Release the mouse
  </div>
  <div class="cta" id="ctaButton">Loading…</div>
  <div id="loadBar"><div></div></div>
  <div id="loadLabel">Preparing scene</div>
</div>

<!--
  Importmap is used only when the source HTML is served directly
  (e.g. GitHub Pages set to "Deploy from a branch"). When Vite builds,
  the generated dist/index.html replaces the script src with a bundled
  asset and the imports are already resolved inline, so the importmap
  is a harmless no-op.
-->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/",
    "postprocessing": "https://esm.sh/postprocessing@6.39.1?deps=three@0.170.0&external=three"
  }
}
</script>
<script type="module" src="./viewer/js/main.js"></script>
</body>
</html>
